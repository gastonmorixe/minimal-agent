name: CI

# Umbrella gate: init submodules, install both trees, run both checks.
# Private sibling submodules need a classic/fine-grained PAT with `repo`
# (secret: SUBMODULES_PAT). GITHUB_TOKEN cannot clone other private repos.
#
# Also lint commit messages (Conventional Commits) via Commitlint.
on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        env:
          HUSKY: "0"
        # Root bun.lock is gitignored (same policy as plugins); do not --frozen-lockfile.
        run: bun install

      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: bun run commitlint:last

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: bunx --bun commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check:
    name: core + plugins check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # Checkout without submodules first, then init with retries. Pin bumps that
      # race a sibling push otherwise fail with "not our ref" / upload-pack.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_PAT }}
          fetch-depth: 0
          submodules: false

      - name: Init submodules (retry)
        env:
          TOKEN: ${{ secrets.SUBMODULES_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          for attempt in 1 2 3 4 5 6; do
            if git submodule sync --recursive \
              && git submodule update --init --recursive; then
              exit 0
            fi
            echo "submodule update failed (attempt ${attempt}); waiting for sibling pushes..."
            sleep $((attempt * 10))
          done
          echo "FATAL: submodule gitlink SHA(s) not reachable on remotes." >&2
          echo "Push submodule commits BEFORE bumping/pushing monorepo pins." >&2
          git ls-tree HEAD minimal-agent-core minimal-agent-plugins || true
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install root (orchestration scripts)
        env:
          HUSKY: "0"
        # Root bun.lock is gitignored; install resolves from package.json.
        run: bun install

      - name: Install core
        working-directory: minimal-agent-core
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Install plugins
        working-directory: minimal-agent-plugins
        env:
          HUSKY: "0"
        # plugins bun.lock is gitignored; install resolves from package.json/catalog
        run: bun install

      - name: Check core
        working-directory: minimal-agent-core
        run: bun run check

      - name: Check plugins
        working-directory: minimal-agent-plugins
        run: bun run check

      - name: Version status (informational)
        run: bun run scripts/version.ts status
